<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro" title="Alternar modo claro/oscuro">
        <span aria-hidden="true">🌙</span><span class="track"><span class="thumb"></span></span><span aria-hidden="true">☀️</span>
      </button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="go-records" class="records-box hidden">
            <p class="records-heading">TOP 5</p>
            <div id="go-records-table"></div>
            <form id="name-form" class="name-form hidden" autocomplete="off">
              <label for="player-name">¡Nuevo record! Tu nombre:</label>
              <div class="name-row">
                <input id="player-name" type="text" maxlength="12" placeholder="Anónimo" />
                <button type="submit" id="save-name-btn">Guardar</button>
              </div>
            </form>
            <p id="go-stats" class="records-stats"></p>
          </div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>


      <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
        <div class="overlay-box pause-box">
          <p class="pause-title">PAUSA</p>
          <button id="pause-resume" class="pause-btn">Reanudar</button>
          <button id="pause-restart" class="pause-btn">Reiniciar</button>
          <button id="pause-controls-btn" class="pause-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
          <ul id="pause-controls" class="pause-controls hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <label class="pause-level" for="start-level">Nivel inicial
            <select id="start-level"></select>
          </label>
          <p class="pause-hint">Se aplica a la próxima partida</p>
        </div>
      </div>

      <div id="start-screen" class="overlay">
        <div class="overlay-box">
          <p id="start-title">TETRIS</p>
          <button id="play-btn">Jugar</button>
          <div class="records-box">
            <p class="records-heading">TOP 5</p>
            <div id="start-records-table"></div>
            <p id="start-stats" class="records-stats"></p>
            <button id="reset-records-btn" class="link-btn">Resetear records</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
